  .top::after{content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,#111 46%,rgba(17,17,17,.35) 74%,rgba(17,17,17,0) 100%);}
  .top > *{position:relative;z-index:2;}
  .top .nombre{font-family:var(--serif);font-size:19px;letter-spacing:3.6px;text-transform:uppercase;
    font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.55);}
  .top .sub{display:flex;align-items:baseline;margin-top:4px;
    font-size:10.5px;letter-spacing:2.6px;text-transform:uppercase;opacity:.82;
    text-shadow:0 1px 5px rgba(0,0,0,.55);}
  .top .sub em{font-style:normal;letter-spacing:.4px;text-transform:none;}

  /* ── estado de conexión ───────────────────── */
  .estado-conexion{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:7px 18px;font-size:11px;color:var(--gris);background:var(--papel);
    border-bottom:1px solid var(--linea);position:sticky;top:0;z-index:19;}
  .fecha-hoy{font-style:normal;color:var(--gris);}
  .estado-conexion .punto{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:7px;}
  .nube .punto{background:var(--verde);} .local .punto{background:#C9A227;}
  .mini{border:1px solid var(--linea);background:var(--papel);border-radius:99px;padding:0 16px;
    font-size:12.5px;cursor:pointer;white-space:nowrap;min-height:44px;display:inline-flex;align-items:center;}
  .aviso-sin-guardado{background:#4A3B00;color:#FFE9A8;font-size:12px;padding:9px 18px;text-align:center;}

  /* ── vistas ───────────────────────────────── */
  .vista{padding:14px 14px 24px;}
  .titulo-vista{font-family:var(--serif);font-size:12px;letter-spacing:2.4px;text-transform:uppercase;
    color:var(--gris);margin:22px 4px 9px;}
  .titulo-vista:first-child{margin-top:4px;}

  /* ── filtros del tablero ──────────────────── */
  .segmentos{display:flex;gap:4px;background:#E3E5E7;border-radius:12px;padding:4px;margin-bottom:14px;}
  .segmentos button{flex:1;border:none;background:none;border-radius:10px;padding:8px 4px;
    font-size:13px;font-weight:600;cursor:pointer;color:var(--gris);min-height:50px;}
  .segmentos button[aria-pressed="true"]{background:var(--papel);color:var(--tinta);box-shadow:var(--sombra);}
  .segmentos small{display:block;font-size:10px;font-weight:400;opacity:.7;}

  /* ── tarjetas de Biblia ───────────────────── */
  .rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;}
  .item{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:12px 8px 10px;
    cursor:pointer;text-align:center;min-height:92px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:5px;box-shadow:var(--sombra);
    transition:transform .12s ease;}
  .item:active{transform:scale(.97);}
  .item .cod{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:1.4px;}
  .item .quien{font-size:11px;line-height:1.25;overflow:hidden;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--gris);}
  .item.prestada{background:var(--kraft-claro);border-color:var(--kraft);}
  .item.prestada .cod{color:var(--kraft-oscuro);}
  .item.prestada .quien{color:var(--tinta);font-weight:600;}
  .marca-estado{width:6px;height:6px;border-radius:50%;background:#CBD0D4;}
  .item.prestada .marca-estado{background:var(--kraft-oscuro);}
  .item:not(.prestada) .marca-estado{background:var(--verde);}

  /* ── listas ───────────────────────────────── */
  .tarjeta{background:var(--papel);border:1px solid var(--linea);border-radius:14px;
    box-shadow:var(--sombra);overflow:hidden;}
  .fila{display:flex;align-items:center;gap:11px;padding:11px 14px;border-top:1px solid var(--linea);font-size:14px;}
  .tarjeta .fila:first-child{border-top:none;}
  .fila .cod2{font-family:var(--serif);font-weight:700;letter-spacing:1px;min-width:54px;}
  .fila .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fila .meta{color:var(--gris);font-size:11.5px;white-space:nowrap;}
  .vacio{padding:26px 16px;text-align:center;color:var(--gris);font-size:13px;}
  .inicial{width:30px;height:30px;border-radius:50%;background:var(--kraft-claro);color:var(--kraft-oscuro);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none;}
  .barra{flex:0 0 68px;height:6px;background:#E8EAEC;border-radius:4px;overflow:hidden;}
  .barra i{display:block;height:100%;background:linear-gradient(90deg,var(--kraft),var(--kraft-oscuro));border-radius:4px;}

  /* ── panel destacado ──────────────────────── */
  .hero{background:var(--tinta);color:#fff;border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);}
  .hero .cifra{font-family:var(--serif);font-size:44px;line-height:1;}
  .hero .cifra small{font-size:14px;opacity:.7;margin-left:6px;font-family:inherit;}
  .hero .pie{font-size:12px;opacity:.75;margin-top:5px;}
  .alerta{background:var(--kraft-claro);border:1px solid var(--kraft);border-radius:12px;
    padding:11px 14px;font-size:13px;margin-top:10px;}
  .alerta b{color:var(--kraft-oscuro);}

  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .kpi{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:14px;
    box-shadow:var(--sombra);border-top:4px solid var(--kraft);}
  .kpi:nth-child(1){border-top-color:var(--tinta);}
  .kpi:nth-child(2){border-top-color:var(--verde);}
  .kpi:nth-child(4){border-top-color:var(--kraft-oscuro);}
  .kpi b{display:block;font-family:var(--serif);font-size:28px;line-height:1;}
  .kpi small{display:block;font-size:11px;color:var(--gris);margin-top:5px;letter-spacing:.4px;}

  .grafico{display:flex;align-items:flex-end;gap:5px;height:126px;padding:12px 12px 0;}
  .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;
       border:none;background:none;cursor:pointer;padding:0;min-width:0;}
  .col i{display:block;width:100%;background:var(--kraft);border-radius:5px 5px 0 0;min-height:3px;
         transition:background .12s ease;}
  .col.activa i{background:var(--tinta);}
  .col span{font-size:8.5px;color:var(--gris);white-space:nowrap;overflow:hidden;max-width:100%;text-overflow:ellipsis;}
  .col b{font-size:10px;font-weight:700;}
  .col.activa b{color:var(--tinta);}
  .segmentos.chico{margin-bottom:8px;}
  .segmentos.chico button{padding:6px 3px;font-size:12.5px;min-height:44px;}
  .pos{width:20px;text-align:center;font-family:var(--serif);font-weight:700;color:var(--kraft-oscuro);flex:none;}
  .hero.con-dona{display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .cifra-txt{font-family:var(--serif);font-size:19px;letter-spacing:.4px;}
  .dona{width:96px;height:96px;flex:none;}
  .mini-leyenda{display:flex;align-items:center;gap:6px;font-size:10.5px;opacity:.8;margin-top:9px;}
  .mini-leyenda .pk,.mini-leyenda .pb{width:9px;height:9px;border-radius:3px;display:inline-block;}
  .mini-leyenda .pk{background:var(--kraft);}
  .mini-leyenda .pb{background:rgba(255,255,255,.3);margin-left:8px;}
  .cont-linea{padding:8px 6px 0;}
  .cont-linea svg{width:100%;height:auto;display:block;}
  .destacado{background:var(--kraft-claro);border:1px solid var(--kraft);border-radius:12px;
    padding:11px 14px;font-size:13.5px;margin-top:10px;}
  .ayuda{font-size:10px;letter-spacing:.5px;text-transform:none;opacity:.8;}
  .solo-imprimir{display:none;}

  .fichas{display:flex;flex-wrap:wrap;gap:7px;}
  .ficha{border:1px solid var(--linea);background:var(--papel);border-radius:99px;padding:7px 13px;font-size:12px;}

  /* ── hoja inferior ────────────────────────── */
  .fondo{position:fixed;inset:0;background:rgba(17,17,17,.45);z-index:60;
    display:flex;align-items:flex-end;justify-content:center;
    animation:aparecer .16s ease;}
  .hoja{background:var(--papel);width:100%;max-width:680px;border-radius:20px 20px 0 0;
    padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;
    animation:subir .2s cubic-bezier(.2,.8,.3,1);}
  @keyframes aparecer{from{opacity:0}to{opacity:1}}
  @keyframes subir{from{transform:translateY(28px)}to{transform:translateY(0)}}
  @media (prefers-reduced-motion:reduce){.fondo,.hoja{animation:none}.item{transition:none}}
  .asa{width:38px;height:4px;border-radius:99px;background:#D6D9DC;margin:0 auto 14px;}
  .hoja h2{font-family:var(--serif);font-size:20px;letter-spacing:.6px;margin:0 0 3px;}
  .hoja p{margin:0 0 14px;color:var(--gris);font-size:13.5px;}
  .hoja input{width:100%;padding:14px 13px;font-size:17px;border:1.5px solid var(--linea);
    border-radius:12px;font-family:inherit;background:#FAFBFB;}
  .acciones{display:flex;gap:9px;margin-top:16px;}
  .acciones button{flex:1;padding:14px;border-radius:12px;border:none;font-size:16px;font-weight:700;cursor:pointer;min-height:52px;}
  .primario{background:var(--tinta);color:#fff;}
  .kraft{background:var(--kraft-oscuro);color:#fff;}
  .neutro{background:#EDEFF1;}
  .aviso{background:var(--kraft-claro);border:1px solid var(--kraft);color:var(--kraft-oscuro);
    padding:10px 12px;border-radius:10px;font-size:12.5px;margin-bottom:12px;}
  .personas{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px;max-height:210px;overflow:auto;
    border-top:1px solid var(--linea);padding-top:14px;}
  .persona{border:1.5px solid var(--tinta);background:var(--papel);border-radius:99px;
    padding:0 17px;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;min-height:48px;}
  .persona i{font-style:normal;font-size:10px;background:var(--kraft);border-radius:99px;padding:1px 6px;}
  .pista{font-size:12.5px;color:var(--gris);margin-top:14px;}

  /* ── guía ─────────────────────────────────── */
  .paso{display:flex;gap:12px;padding:13px 14px;border-top:1px solid var(--linea);}
  .tarjeta .paso:first-child{border-top:none;}
  .paso .num{width:26px;height:26px;border-radius:50%;background:var(--tinta);color:#fff;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
  .paso div{font-size:13.5px;}
  .caso{padding:12px 14px;border-top:1px solid var(--linea);font-size:13px;}
  .tarjeta .caso:first-child{border-top:none;}
  .caso b{display:block;margin-bottom:2px;}
  .caso span{color:var(--gris);}

  /* ── navegación inferior ──────────────────── */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.94);
    backdrop-filter:blur(12px);border-top:1px solid var(--linea);
    padding-bottom:env(safe-area-inset-bottom);display:flex;}
  .nav button{flex:1;background:none;border:none;padding:10px 4px 9px;cursor:pointer;min-height:58px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--gris);font-size:11px;}
  .nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round;}
  .nav button[aria-current="page"]{color:var(--tinta);font-weight:700;}
  .nav button[aria-current="page"] svg{stroke-width:2.1;}
  .cargando{padding:60px;text-align:center;color:var(--gris);}

  @media print{
    @page{ size:A4; margin:12mm; }
    body{background:#fff;padding:0;font-size:11.5px;}
    .top,.estado-conexion,.nav,.no-imprimir,.aviso-sin-guardado{display:none!important;}
    .app{max-width:none;}
    .vista{padding:0;}
    .tarjeta,.kpi,.hero,.alerta,.destacado{box-shadow:none;break-inside:avoid;}
    .hero{background:#fff;color:var(--tinta);border:2px solid var(--tinta);}
    .solo-imprimir{display:block;}
    .encabezado-informe{border-bottom:3px solid var(--tinta);padding-bottom:8px;margin-bottom:14px;
      font-size:11px;color:var(--gris);}
    .encabezado-informe .nombre-imp{font-family:var(--serif);font-size:17px;letter-spacing:3px;
      color:var(--tinta);margin-bottom:2px;}
    .pie-informe{border-top:1px solid var(--linea);margin-top:16px;padding-top:8px;
      font-size:10px;color:var(--gris);text-align:center;}
    .grafico{height:100px;}
    .col i,.barra i,.kraft,.inicial,.alerta,.destacado{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>
</head>
<body>
<div class="app" id="app"><div class="cargando">Cargando…</div></div>

<script>
/* ═══════════════ CONFIGURACIÓN ═══════════════ */
const BASE_DATOS = "https://puntos-noah-default-rtdb.firebaseio.com";
const SEGUNDOS_REFRESCO = 4;

const DIAS  = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const ICONOS = {
  tablero:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>',
  resumen:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  guia:'<svg viewBox="0 0 24 24"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v16H5.5A1.5 1.5 0 0 0 4 20.5Z"/><path d="M4 20.5A1.5 1.5 0 0 1 5.5 19H19v2.5H5.5A1.5 1.5 0 0 1 4 20.5Z"/></svg>'
};

/* ═══════════════ ESTADO ═══════════════ */
let datos = {inventario:{}, prestamos:{}, historial:{}, personas:{}};
let vista = 'tablero';
let filtro = 'todas';
let periodo = 'mes';
let unidadGrafico = 'semana';
let unidadRanking = 'dia';
let colSel = null;
let hoja = null;
let conflicto = '';
let modo = 'local', sinGuardado = false, ultimo = null, temporizador = null;

function idSala(){
  const m = (location.hash||'').match(/sala=([A-Za-z0-9_-]{4,40})/);
  if(m) return m[1];
  const n = Math.random().toString(36).slice(2,8) + Math.random().toString(36).slice(2,6);
  try{ history.replaceState(null,'','#sala='+n); }catch(e){}
  return n;
}
const SALA = idSala();
const RAIZ = BASE_DATOS ? BASE_DATOS.replace(/\/$/,'') + '/biblias/' + SALA : '';
const CLAVE_LOCAL = 'biblias:' + SALA;

const LOCAL = (function(){
  try{ const t='__p__'; localStorage.setItem(t,'1'); localStorage.removeItem(t);
       return {ok:true, set:(k,v)=>localStorage.setItem(k,v), get:k=>localStorage.getItem(k)};
  }catch(e){ return {ok:false, set:()=>{}, get:()=>null}; }
})();

/* ═══════════════ UTILIDADES ═══════════════ */
function esc(t){ return String(t==null?'':t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function claveNombre(n){ return String(n).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60); }
function iniciales(n){ return String(n).trim().split(/\s+/).slice(0,2).map(p=>p[0]||'').join('').toUpperCase(); }
function hoyISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fechaCorta(ts){ const d=new Date(ts); return d.getDate()+' '+MESES[d.getMonth()].slice(0,3); }
function fechaLarga(iso){ const [a,m,d]=iso.split('-').map(Number); return d+' de '+MESES[m-1]; }
function isoDeTs(ts){ const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function codigos(){ return Object.keys(datos.inventario).sort((a,b)=>a.localeCompare(b,'es',{numeric:true})); }
function prestadas(){ return Object.keys(datos.prestamos); }
function personasOrdenadas(f){
  const q = claveNombre(f||'');
  return Object.values(datos.personas||{})
    .filter(p=>!q || claveNombre(p.n).includes(q))
    .sort((a,b)=>(b.v||0)-(a.v||0) || (b.u||0)-(a.u||0) || a.n.localeCompare(b.n,'es'));
}
function historialCompleto(){
  const out=[];
  Object.entries(datos.historial||{}).forEach(([f,dia])=>
    Object.values(dia||{}).forEach(m=>out.push(Object.assign({f:f}, m))));
  return out;
}
function resumen(desde){
  const m = historialCompleto().filter(x=>x.f>=desde);
  const porPersona={}, porFecha={};
  m.forEach(x=>{ const k=claveNombre(x.n);
    porPersona[k]=porPersona[k]||{n:x.n,v:0}; porPersona[k].v++;
    porFecha[x.f]=(porFecha[x.f]||0)+1; });
  const fechas=Object.keys(porFecha).sort();
  const mejor=fechas.slice().sort((a,b)=>porFecha[b]-porFecha[a])[0]||null;
  return { total:m.length, personas:Object.keys(porPersona).length, jornadas:fechas.length,
    promedio: fechas.length ? Math.round(m.length/fechas.length*10)/10 : 0,
    mejorDia:mejor, mejorDiaTotal:mejor?porFecha[mejor]:0,
    topPersonas: Object.values(porPersona).sort((a,b)=>b.v-a.v).slice(0,7) };
}
/* series agregadas por unidad de tiempo, para gráficos y rankings */
function claveSemana(iso){
  const [a,m,d]=iso.split('-').map(Number);
  const dt=new Date(a,m-1,d); const off=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-off);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
function serie(unidad, desde){
  const m = historialCompleto().filter(x=>!desde || x.f>=desde);
  const cubo={};
  m.forEach(x=>{
    const k = unidad==='dia' ? x.f : unidad==='semana' ? claveSemana(x.f) : unidad==='mes' ? x.f.slice(0,7) : x.f.slice(0,4);
    cubo[k]=(cubo[k]||0)+1;
  });
  return Object.entries(cubo).map(([k,v])=>({k,v})).sort((a,b)=>a.k.localeCompare(b.k));
}
function etiqueta(unidad,k){
  if(unidad==='dia'){ const [a,m,d]=k.split('-'); return Number(d)+' '+MESES[Number(m)-1].slice(0,3); }
  if(unidad==='semana'){ const [a,m,d]=k.split('-'); return 'sem '+Number(d)+' '+MESES[Number(m)-1].slice(0,3); }
  if(unidad==='mes'){ const [a,m]=k.split('-'); return MESES[Number(m)-1].slice(0,3)+' '+a.slice(2); }
  return k;
}
function etiquetaLarga(unidad,k){
  if(unidad==='dia') return fechaLarga(k)+' de '+k.slice(0,4);
  if(unidad==='semana'){ const [a,m,d]=k.split('-'); return 'semana del '+Number(d)+' de '+MESES[Number(m)-1]; }
  if(unidad==='mes'){ const [a,m]=k.split('-'); return MESES[Number(m)-1]+' de '+a; }
  return 'año '+k;
}
/* ═══════════════ DATOS ═══════════════ */
function guardarLocal(){ if(LOCAL.ok){ try{ LOCAL.set(CLAVE_LOCAL, JSON.stringify(datos)); }catch(e){ sinGuardado=true; } } else sinGuardado=true; }
function cargarLocal(){
  if(!LOCAL.ok){ sinGuardado=true; return; }
  try{ const v=LOCAL.get(CLAVE_LOCAL);
    if(v){ const d=JSON.parse(v); if(d) datos=Object.assign({inventario:{},prestamos:{},historial:{},personas:{}}, d); }
  }catch(e){}
}
async function leerNube(){
  if(!RAIZ) return;
  try{
    const r = await fetch(RAIZ+'.json',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const txt = await r.text();
    modo='nube';
    if(txt!==ultimo){
      ultimo=txt; const v=JSON.parse(txt)||{};
      datos={inventario:v.inventario||{}, prestamos:v.prestamos||{}, historial:v.historial||{}, personas:v.personas||{}};
      guardarLocal();
    }
    render();
  }catch(e){ if(modo!=='local'){ modo='local'; render(); } }
}
function escribir(ruta, valor){
  guardarLocal();
  if(!RAIZ) return Promise.resolve();
  ultimo=null;
  const op = valor===null ? {method:'DELETE'} : {method:'PUT', body:JSON.stringify(valor)};
  return fetch(RAIZ+'/'+ruta+'.json', op)
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); })
    .catch(e=>{ console.error(e); modo='local'; sinGuardado=true; render(); });
}
function conectar(){
  if(!RAIZ) return;
  leerNube();
  clearInterval(temporizador);
  temporizador=setInterval(leerNube, SEGUNDOS_REFRESCO*1000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) leerNube(); });
}

/* ═══════════════ OPERACIONES ═══════════════ */
function prestar(codigo, nombre){
  nombre=(nombre||'').trim();
  if(!nombre) return 'Escribe el nombre de la persona';
  if(datos.prestamos[codigo]) return codigo+' ya está prestada a '+datos.prestamos[codigo].n;
  const ts=Date.now(), clave=codigo+'_'+ts, reg={n:nombre,s:ts,h:clave}, f=hoyISO();
  datos.prestamos[codigo]=reg;
  datos.historial[f]=datos.historial[f]||{};
  datos.historial[f][clave]={c:codigo,n:nombre,s:ts,r:null};
  const k=claveNombre(nombre);
  if(k){
    const prev=(datos.personas||{})[k];
    const ficha={n:nombre, v:(prev&&prev.v?prev.v:0)+1, u:ts};
    datos.personas=datos.personas||{}; datos.personas[k]=ficha;
    escribir('personas/'+k, ficha);
  }
  escribir('prestamos/'+codigo, reg);
  escribir('historial/'+f+'/'+clave, {c:codigo,n:nombre,s:ts,r:null});
  return null;
}
function devolver(codigo){
  const p=datos.prestamos[codigo];
  if(!p) return 'Esa Biblia no figura como prestada';
  const ts=Date.now();
  delete datos.prestamos[codigo];
  escribir('prestamos/'+codigo, null);
  if(p.h){
    const f=Object.keys(datos.historial||{}).find(k=>datos.historial[k]&&datos.historial[k][p.h]) || hoyISO();
    if(datos.historial[f]&&datos.historial[f][p.h]) datos.historial[f][p.h].r=ts;
    escribir('historial/'+f+'/'+p.h+'/r', ts);
  }
  return null;
}
function agregarCodigo(c){
  c=(c||'').trim().toUpperCase();
  if(!c) return 'Escribe un código';
  if(datos.inventario[c]) return 'Ese código ya existe';
  datos.inventario[c]=true; escribir('inventario/'+c, true); return null;
}
function quitarCodigo(c){
  if(datos.prestamos[c]) return 'No se puede quitar mientras esté prestada';
  delete datos.inventario[c]; escribir('inventario/'+c, null); return null;
}
function crearSerie(n){
  for(let i=1;i<=n;i++){ const c='B-'+String(i).padStart(2,'0'); if(!datos.inventario[c]) datos.inventario[c]=true; }
  escribir('inventario', datos.inventario);
}

/* ═══════════════ VISTAS ═══════════════ */
function vistaTablero(){
  const cods=codigos(), fuera=prestadas();
  if(!cods.length){
    return `<div class="vista"><div class="tarjeta"><div class="vacio">
      Todavía no hay Biblias cargadas.<br><br>
      <button class="primario" style="padding:12px 18px;border:none;border-radius:12px;font-weight:700;cursor:pointer;" data-serie="30">Crear 30 códigos</button>
      <br><br><button class="mini" data-inventario>Agregar códigos uno por uno</button>
    </div></div></div>`;
  }
  const lista = filtro==='libres' ? cods.filter(c=>!datos.prestamos[c])
              : filtro==='prestadas' ? cods.filter(c=>datos.prestamos[c]) : cods;
  let h=`<div class="vista">
    <div class="segmentos">
      <button data-filtro="todas" aria-pressed="${filtro==='todas'}">Todas<small>${cods.length}</small></button>
      <button data-filtro="libres" aria-pressed="${filtro==='libres'}">Disponibles<small>${cods.length-fuera.length}</small></button>
      <button data-filtro="prestadas" aria-pressed="${filtro==='prestadas'}">Prestadas<small>${fuera.length}</small></button>
    </div>`;
  h += lista.length ? `<div class="rejilla">${lista.map(c=>{
        const p=datos.prestamos[c];
        return `<button class="item ${p?'prestada':''}" data-codigo="${esc(c)}">
          <span class="marca-estado"></span>
          <span class="cod">${esc(c)}</span>
          <span class="quien">${p?esc(p.n):'disponible'}</span></button>`;}).join('')}</div>`
    : `<div class="tarjeta"><div class="vacio">${filtro==='prestadas'?'No hay Biblias prestadas.':'Todas están prestadas.'}</div></div>`;
  if(fuera.length){
    h += `<div class="titulo-vista">Sin devolver · ${fuera.length}</div><div class="tarjeta">`;
    fuera.slice().sort((a,b)=>datos.prestamos[a].s-datos.prestamos[b].s).forEach(c=>{
      const p=datos.prestamos[c];
      h += `<div class="fila"><span class="inicial">${esc(iniciales(p.n))}</span>
        <span class="cod2">${esc(c)}</span><span class="n">${esc(p.n)}</span>
        <span class="meta">${fechaCorta(p.s)}</span></div>`;});
    h += `</div>`;
  }
  h += `<div class="titulo-vista">Inventario</div>
    <div class="tarjeta"><div class="fila"><span class="n">Administrar códigos</span>
      <button class="mini" data-inventario>${cods.length} códigos</button></div></div></div>`;
  return h;
}

function svgDona(prest, total){
  const disp = Math.max(0, total-prest);
  const R=34, C=2*Math.PI*R, frac = total ? prest/total : 0;
  return `<svg viewBox="0 0 96 96" class="dona" role="img" aria-label="${prest} prestadas de ${total}">
    <circle cx="48" cy="48" r="${R}" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="11"/>
    <circle cx="48" cy="48" r="${R}" fill="none" stroke="#C4B2A8" stroke-width="11"
      stroke-dasharray="${(frac*C).toFixed(1)} ${C.toFixed(1)}" stroke-linecap="round"
      transform="rotate(-90 48 48)"/>
    <text x="48" y="45" text-anchor="middle" fill="#fff" font-size="21" font-weight="700" font-family="Rockwell,Georgia,serif">${prest}</text>
    <text x="48" y="60" text-anchor="middle" fill="rgba(255,255,255,.75)" font-size="9.5">de ${total}</text>
  </svg>`;
}
function svgEvolucion(sg, sel){
  if(!sg.length) return '';
  const W=340, H=132, m={t:16,r:10,b:24,l:10};
  const iw=W-m.l-m.r, ih=H-m.t-m.b;
  const max=Math.max(1,...sg.map(x=>x.v));
  const px=i=> sg.length===1 ? m.l+iw/2 : m.l + i*(iw/(sg.length-1));
  const py=v=> m.t + ih - (v/max)*ih;
  const pts=sg.map((x,i)=>px(i).toFixed(1)+','+py(x.v).toFixed(1)).join(' ');
  const area=`${m.l},${m.t+ih} ${pts} ${(m.l+ (sg.length===1?iw:iw)).toFixed(1)},${m.t+ih}`;
  return `<svg viewBox="0 0 ${W} ${H}" class="linea" role="img" aria-label="Evolución de préstamos">
    <defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4B2A8" stop-opacity=".5"/>
      <stop offset="1" stop-color="#C4B2A8" stop-opacity=".04"/></linearGradient></defs>
    ${[0.5,1].map(f=>`<line x1="${m.l}" y1="${py(max*f).toFixed(1)}" x2="${W-m.r}" y2="${py(max*f).toFixed(1)}" stroke="#E1E3E5" stroke-dasharray="3 4"/>`).join('')}
    <polygon points="${area}" fill="url(#gA)"/>
    <polyline points="${pts}" fill="none" stroke="#7A6257" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    ${sg.map((x,i)=>`<g class="punto-svg" data-col="${x.k}" style="cursor:pointer">
      <circle cx="${px(i).toFixed(1)}" cy="${py(x.v).toFixed(1)}" r="15" fill="transparent"/>
      <circle cx="${px(i).toFixed(1)}" cy="${py(x.v).toFixed(1)}" r="${x.k===sel?6:4}" fill="${x.k===sel?'#111':'#7A6257'}" stroke="#fff" stroke-width="2"/>
      ${x.k===sel?`<text x="${px(i).toFixed(1)}" y="${(py(x.v)-11).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="#111">${x.v}</text>`:''}
      <text x="${px(i).toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="8.5" fill="#71767C">${etiqueta(unidadGrafico,x.k)}</text>
    </g>`).join('')}
  </svg>`;
}
function vistaResumen(){
  const hoyI=hoyISO(), anio=hoyI.slice(0,4);
  const r = periodo==='semana' ? resumen(claveSemana(hoyI))
          : periodo==='mes'    ? resumen(hoyI.slice(0,7)+'-01')
          :                      resumen(anio+'-01-01');
  const nomPeriodo = periodo==='semana' ? 'esta semana' : periodo==='mes' ? MESES[new Date().getMonth()] : 'el año '+anio;
  const fuera = prestadas().slice().sort((a,b)=>datos.prestamos[a].s-datos.prestamos[b].s);
  const atrasadas = fuera.filter(c=>isoDeTs(datos.prestamos[c].s)<hoyI);

  /* gráfico 1: evolución por unidad elegida */
  const sg = serie(unidadGrafico).slice(-10);
  const maxSg = Math.max(1,...sg.map(x=>x.v));
  const sel = colSel && sg.some(x=>x.k===colSel) ? colSel : null;
  const info = sel ? sg.find(x=>x.k===sel) : null;

  /* gráfico 2 + ranking: períodos más activos */
  const sr = serie(unidadRanking);
  const topR = sr.slice().sort((a,b)=>b.v-a.v).slice(0,5);
  const maxR = topR[0] ? topR[0].v : 1;
  const nombreUnidad = {dia:'Días',semana:'Semanas',mes:'Meses',anio:'Años'};

  const maxP = r.topPersonas[0] ? r.topPersonas[0].v : 1;

  let h=`<div class="vista" id="informe">
    <div class="solo-imprimir encabezado-informe">
      <div class="nombre-imp">BIBLIOTECA · FRATERNIDAD DE FE</div>
      <div>Informe de préstamos · generado el ${fechaLarga(hoyI)} de ${anio}</div>
    </div>

    <div class="hero con-dona">
      <div>
        <div class="cifra-txt">Prestadas ahora</div>
        <div class="pie">${fuera.length?'Devolución pendiente':'Todas están en el estante'}</div>
        <div class="mini-leyenda"><span class="pk"></span>Prestadas <span class="pb"></span>Disponibles</div>
      </div>
      ${svgDona(fuera.length, codigos().length)}
    </div>
    ${atrasadas.length?`<div class="alerta"><b>${atrasadas.length} de otro día:</b> ${atrasadas.map(c=>esc(c)+' · '+esc(datos.prestamos[c].n)).join(' — ')}</div>`:''}

    ${fuera.length?`<div class="titulo-vista">Quién las tiene</div><div class="tarjeta">${fuera.map(c=>{
      const p=datos.prestamos[c];
      return `<div class="fila"><span class="inicial">${esc(iniciales(p.n))}</span>
        <span class="cod2">${esc(c)}</span><span class="n">${esc(p.n)}</span>
        <span class="meta">${fechaCorta(p.s)}</span></div>`;}).join('')}</div>`:''}

    <div class="titulo-vista">Actividad</div>
    <div class="segmentos no-imprimir">
      <button data-periodo="semana" aria-pressed="${periodo==='semana'}">Semana</button>
      <button data-periodo="mes" aria-pressed="${periodo==='mes'}">Mes</button>
      <button data-periodo="anio" aria-pressed="${periodo==='anio'}">Año</button>
    </div>
    <div class="kpis">
      <div class="kpi"><b>${r.total}</b><small>Préstamos ${nomPeriodo}</small></div>
      <div class="kpi"><b>${r.personas}</b><small>Personas distintas</small></div>
      <div class="kpi"><b>${r.jornadas}</b><small>Jornadas</small></div>
      <div class="kpi"><b>${r.promedio}</b><small>Promedio por jornada</small></div>
    </div>
    ${r.mejorDia?`<div class="destacado">★ Récord del período: <b>${fechaLarga(r.mejorDia)}</b>, con <b>${r.mejorDiaTotal}</b> préstamos</div>`:''}

    <div class="titulo-vista">Evolución <span class="ayuda no-imprimir">toca una columna</span></div>
    <div class="segmentos chico no-imprimir">
      ${['semana','mes','anio'].map(u=>`<button data-ugrafico="${u}" aria-pressed="${unidadGrafico===u}">${u==='anio'?'Por año':u==='mes'?'Por mes':'Por semana'}</button>`).join('')}
    </div>
    <div class="tarjeta">
      ${sg.length?`<div class="cont-linea">${svgEvolucion(sg, sel)}</div>
        <div class="fila"><span class="meta">${info ? etiquetaLarga(unidadGrafico,info.k)+' · '+info.v+' préstamos' : 'Últimos '+sg.length+' períodos · toca un punto'}</span></div>`
      :`<div class="vacio">Aún no hay préstamos registrados. El gráfico aparece con el primer sábado.</div>`}
    </div>

    <div class="titulo-vista">Períodos más activos</div>
    <div class="segmentos chico no-imprimir">
      ${['dia','semana','mes','anio'].map(u=>`<button data-uranking="${u}" aria-pressed="${unidadRanking===u}">${nombreUnidad[u]}</button>`).join('')}
    </div>
    <div class="tarjeta">
      ${topR.length?topR.map((x,i)=>`<div class="fila">
          <span class="pos">${i+1}</span>
          <span class="n">${etiquetaLarga(unidadRanking,x.k)}</span>
          <span class="barra"><i style="width:${Math.round(x.v/maxR*100)}%"></i></span>
          <span class="meta">${x.v}</span></div>`).join('')
        :`<div class="vacio">Sin datos todavía.</div>`}
    </div>

    <div class="titulo-vista">Quiénes más piden · ${nomPeriodo}</div>
    <div class="tarjeta">
      ${r.topPersonas.length?r.topPersonas.map((p,i)=>`<div class="fila">
          <span class="pos">${i+1}</span>
          <span class="inicial">${esc(iniciales(p.n))}</span>
          <span class="n">${esc(p.n)}</span>
          <span class="barra"><i style="width:${Math.round(p.v/maxP*100)}%"></i></span>
          <span class="meta">${p.v}</span></div>`).join('')
        :`<div class="vacio">Sin préstamos en este período.</div>`}
    </div>

    <div class="acciones no-imprimir" style="margin-top:18px;">
      <button class="primario" data-imprimir>Imprimir informe</button>
    </div>
    <div class="solo-imprimir pie-informe">Biblioteca · Fraternidad de Fe — uso interno</div>
  </div>`;
  return h;
}
function vistaGuia(){
  return `<div class="vista">
    <div class="titulo-vista">Prestar</div>
    <div class="tarjeta">
      <div class="paso"><span class="num">1</span><div>Toca el recuadro de la Biblia que entregas.</div></div>
      <div class="paso"><span class="num">2</span><div>Toca el nombre de la persona, o escríbelo si es la primera vez. Los nombres quedan guardados y aparecen ordenados por quién pide más seguido.</div></div>
    </div>
    <div class="titulo-vista">Devolver</div>
    <div class="tarjeta">
      <div class="paso"><span class="num">1</span><div>Toca el recuadro de esa misma Biblia.</div></div>
      <div class="paso"><span class="num">2</span><div>Toca <b>Devolver</b>.</div></div>
    </div>
    <div class="titulo-vista">Antes del primer sábado</div>
    <div class="tarjeta">
      <div class="paso"><span class="num">1</span><div>Carga los códigos en <b>Administrar códigos</b>. Se hace una sola vez.</div></div>
      <div class="paso"><span class="num">2</span><div>Toca <b>Copiar link</b> arriba y envíaselo a quienes vayan a registrar. Deben abrir ese link completo: es lo que los conecta al mismo registro.</div></div>
      <div class="paso"><span class="num">3</span><div>Guárdalo en la pantalla de inicio del teléfono desde el menú del navegador.</div></div>
    </div>
    <div class="titulo-vista">Situaciones frecuentes</div>
    <div class="tarjeta">
      <div class="caso"><b>Registré a la persona equivocada</b><span>Toca el recuadro, Devolver, y préstala al nombre correcto.</span></div>
      <div class="caso"><b>Figura prestada y está en el estante</b><span>Alguien olvidó registrar la devolución. Toca el recuadro y Devolver.</span></div>
      <div class="caso"><b>Avisa que ya está prestada</b><span>Otro registrador la entregó recién. El aviso dice a nombre de quién.</span></div>
      <div class="caso"><b>Dice "Sin conexión"</b><span>Sigue registrando. Se guarda en el teléfono y se sincroniza al volver la señal.</span></div>
      <div class="caso"><b>Entré y no aparece nada</b><span>Abriste el link sin el código de sala. Pide el link completo.</span></div>
    </div>
    <div class="titulo-vista">En Resumen encuentras</div>
    <div class="tarjeta">
      <div class="caso"><b>Quién tiene cada Biblia ahora</b><span>Y un aviso si alguna quedó de un sábado anterior.</span></div>
      <div class="caso"><b>Actividad del mes y del año</b><span>Préstamos, personas distintas, jornadas y promedio.</span></div>
      <div class="caso"><b>Quiénes más piden y qué Biblias circulan</b><span>Incluye las que nunca han salido del estante.</span></div>
    </div>
    <p class="pista">Retirar un código borra esa Biblia del tablero; los préstamos ya registrados se conservan en el historial.</p>
  </div>`;
}

/* ═══════════════ HOJAS ═══════════════ */
function hojaHTML(){
  if(!hoja) return '';
  let c='';
  if(hoja.tipo==='prestar'){
    const lista=personasOrdenadas(hoja.filtro).slice(0,40);
    c=`<h2>Entregar ${esc(hoja.codigo)}</h2><p>¿A nombre de quién?</p>
      ${conflicto?`<div class="aviso">${esc(conflicto)}</div>`:''}
      <input id="nombre" autocomplete="off" autocapitalize="words" placeholder="Buscar o escribir un nombre" value="${esc(hoja.filtro||'')}">
      ${lista.length?`<div class="personas">${lista.map(p=>
        `<button class="persona" data-persona="${esc(p.n)}">${esc(p.n)}${p.v>1?`<i>${p.v}</i>`:''}</button>`).join('')}</div>`
       :`<p class="pista">${Object.keys(datos.personas||{}).length?'Ningún nombre coincide. Escríbelo completo y toca Prestar.':'Los nombres que registres quedarán guardados para la próxima vez.'}</p>`}
      <div class="acciones"><button class="neutro" data-cerrar>Cancelar</button>
        <button class="primario" data-confirmar>Prestar</button></div>`;
  }
  if(hoja.tipo==='devolver'){
    const p=datos.prestamos[hoja.codigo];
    c=`<h2>${esc(hoja.codigo)}</h2>
      <p>${p?'Prestada a <b>'+esc(p.n)+'</b> el '+fechaCorta(p.s):'Ya fue devuelta'}</p>
      ${conflicto?`<div class="aviso">${esc(conflicto)}</div>`:''}
      <div class="acciones"><button class="neutro" data-cerrar>Cerrar</button>
        ${p?'<button class="kraft" data-devolver>Devolver</button>':''}</div>`;
  }
  if(hoja.tipo==='inventario'){
    const cods=codigos();
    c=`<h2>Administrar códigos</h2><p>Usa el mismo código que está marcado en cada Biblia.</p>
      ${conflicto?`<div class="aviso">${esc(conflicto)}</div>`:''}
      <input id="codigo" autocomplete="off" placeholder="Ej: B-07">
      <div class="acciones"><button class="neutro" data-cerrar>Cerrar</button>
        <button class="primario" data-agregar>Agregar</button></div>
      <div class="tarjeta" style="margin-top:16px;max-height:240px;overflow:auto;">
        ${cods.length?cods.map(c2=>`<div class="fila"><span class="cod2">${esc(c2)}</span>
          <span class="n meta">${datos.prestamos[c2]?'prestada a '+esc(datos.prestamos[c2].n):'disponible'}</span>
          <button class="mini" data-quitar="${esc(c2)}">Quitar</button></div>`).join('')
          :'<div class="vacio">Sin códigos</div>'}
      </div>`;
  }
  return `<div class="fondo" data-cerrar><div class="hoja"><div class="asa"></div>${c}</div></div>`;
}

/* ═══════════════ RENDER ═══════════════ */
function render(){
  const app=document.getElementById('app');
  if(!app) return;
  const hoy=new Date();
  const cuerpo = vista==='resumen' ? vistaResumen() : vista==='guia' ? vistaGuia() : vistaTablero();

  app.innerHTML = `
    <div class="top">
      <div class="nombre">Biblioteca</div>
      <div class="sub"><span>Fraternidad de Fe</span></div>
    </div>
    <div class="estado-conexion ${modo}">
      <span><span class="punto"></span>${modo==='nube'?'Registro compartido':(RAIZ?'Sin conexión · se guardará solo':'Solo en este dispositivo')}
        <em class="fecha-hoy">· ${DIAS[hoy.getDay()]} ${hoy.getDate()} de ${MESES[hoy.getMonth()]}</em></span>
      <button class="mini" data-compartir>Copiar link</button>
    </div>
    ${sinGuardado?'<div class="aviso-sin-guardado">Este dispositivo no está guardando. Anota los préstamos en papel por ahora.</div>':''}
    ${cuerpo}
    ${hojaHTML()}
    <nav class="nav">
      ${[['tablero','Tablero'],['resumen','Resumen'],['guia','Guía']].map(([v,t])=>
        `<button data-vista="${v}" ${vista===v?'aria-current="page"':''}>${ICONOS[v]}<span>${t}</span></button>`).join('')}
    </nav>`;

  const $=s=>app.querySelector(s);
  app.querySelectorAll('[data-vista]').forEach(b=>b.addEventListener('click',()=>{ vista=b.dataset.vista; hoja=null; render(); window.scrollTo(0,0); }));
  app.querySelectorAll('[data-filtro]').forEach(b=>b.addEventListener('click',()=>{ filtro=b.dataset.filtro; render(); }));
  app.querySelectorAll('[data-periodo]').forEach(b=>b.addEventListener('click',()=>{ periodo=b.dataset.periodo; render(); }));
  app.querySelectorAll('[data-ugrafico]').forEach(b=>b.addEventListener('click',()=>{ unidadGrafico=b.dataset.ugrafico; colSel=null; render(); }));
  app.querySelectorAll('[data-uranking]').forEach(b=>b.addEventListener('click',()=>{ unidadRanking=b.dataset.uranking; render(); }));
  app.querySelectorAll('[data-col]').forEach(b=>b.addEventListener('click',()=>{ colSel = colSel===b.dataset.col ? null : b.dataset.col; render(); }));
  const imp=$('[data-imprimir]');
  if(imp) imp.addEventListener('click',()=>window.print());
  app.querySelectorAll('[data-codigo]').forEach(b=>b.addEventListener('click',()=>{
    conflicto=''; hoja={tipo: datos.prestamos[b.dataset.codigo]?'devolver':'prestar', codigo:b.dataset.codigo, filtro:''};
    render(); const i=$('#nombre'); if(i) i.focus(); }));
  app.querySelectorAll('[data-cerrar]').forEach(b=>b.addEventListener('click',e=>{
    if(e.target!==b) return; hoja=null; conflicto=''; render(); }));
  const conf=$('[data-confirmar]');
  if(conf) conf.addEventListener('click',()=>{
    const err=prestar(hoja.codigo, ($('#nombre')||{}).value || hoja.filtro || '');
    if(err){ conflicto=err; render(); const i=$('#nombre'); if(i) i.focus(); } else { hoja=null; conflicto=''; render(); } });
  const nom=$('#nombre');
  if(nom){
    nom.addEventListener('keydown',e=>{ if(e.key==='Enter'&&conf) conf.click(); });
    nom.addEventListener('input',()=>{ const pos=nom.selectionStart; hoja.filtro=nom.value; render();
      const n2=document.getElementById('nombre'); if(n2){ n2.focus(); try{ n2.setSelectionRange(pos,pos); }catch(e){} } });
  }
  app.querySelectorAll('[data-persona]').forEach(b=>b.addEventListener('click',()=>{
    const err=prestar(hoja.codigo, b.dataset.persona);
    if(err){ conflicto=err; render(); } else { hoja=null; conflicto=''; render(); } }));
  const dev=$('[data-devolver]');
  if(dev) dev.addEventListener('click',()=>{
    const err=devolver(hoja.codigo);
    if(err){ conflicto=err; render(); } else { hoja=null; render(); } });
  app.querySelectorAll('[data-inventario]').forEach(b=>b.addEventListener('click',()=>{ hoja={tipo:'inventario'}; conflicto=''; render(); }));
  const agr=$('[data-agregar]');
  if(agr) agr.addEventListener('click',()=>{ conflicto=agregarCodigo($('#codigo').value)||''; render(); const i=$('#codigo'); if(i) i.focus(); });
  app.querySelectorAll('[data-quitar]').forEach(b=>b.addEventListener('click',()=>{ conflicto=quitarCodigo(b.dataset.quitar)||''; render(); }));
  const serie=$('[data-serie]');
  if(serie) serie.addEventListener('click',()=>{ crearSerie(Number(serie.dataset.serie)); render(); });
  const comp=$('[data-compartir]');
  if(comp) comp.addEventListener('click',()=>{
    const u=location.href;
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(u).then(()=>{ comp.textContent='Copiado'; setTimeout(render,1800); }).catch(()=>prompt('Copia este link:',u));
    else prompt('Copia este link:',u); });
}

cargarLocal(); render(); conectar();
</script>
</body>
